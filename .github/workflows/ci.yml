# runs on every push and pull request. both jobs run at the same time,
# a red X on GitHub means one of them failed (click it to see which step)
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # same java as the Dockerfile. cache keeps maven from downloading everything every run
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # just unit tests, no database needed
      - run: mvn -B test

  frontend:
    name: Frontend lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # node 24 like Dockerfile.dev (it comes with npm 11, npm 10 crashes installing vitest)
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ci = install exactly what's in package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # tsc -b + vite build, catches type errors
      - run: npm run build
