# locally these come from .env (DB_URL etc). on Heroku, the Postgres add-on sets JDBC_DATABASE_* instead,
# so fall back to those. ${A:${B}} = use A if it's set, otherwise B
spring.datasource.url=${DB_URL:${JDBC_DATABASE_URL}}
spring.datasource.username=${DB_USER:${JDBC_DATABASE_USERNAME}}
spring.datasource.password=${DB_PASSWORD:${JDBC_DATABASE_PASSWORD}}

# Heroku tells the app which port to listen on in $PORT. 8080 when it isn't set (your laptop)
server.port=${PORT:8080}

# Flyway owns the schema -- Hibernate should never try to create or alter tables itself
spring.jpa.hibernate.ddl-auto=none
# don't keep a database connection open for the whole request. every query happens inside the
# services already, and this also turns off the startup warning about it
spring.jpa.open-in-view=false

# login sessions live in Postgres (V15 makes the tables, so don't let Spring Session make its own)
spring.session.jdbc.initialize-schema=never
# log out after a day of not using the app
spring.session.timeout=1d
# session cookie: JS can't read it, and other sites can't send it along with their requests
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# only send the cookie over https. false locally (localhost is plain http), true on the real server
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# where the React app runs, for CORS. ${NAME:default} = use the env var if it's set, otherwise the default
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# on Heroku every request comes through Heroku's router, so getRemoteAddr() is the router, not the user.
# true = read the user's real IP from the X-Forwarded-For header the router adds (see ClientIpFilter).
# ONLY turn this on behind a proxy like that, otherwise anyone could fake their IP with that header
app.trust-proxy=${TRUST_PROXY:false}

# email. no key = emails get printed to the log instead of sent (fine locally, never on the real server)
app.resend-api-key=${RESEND_API_KEY:}
app.mail-from=${MAIL_FROM:Ledjr <no-reply@ledjr.dev>}
